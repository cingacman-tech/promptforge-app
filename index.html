<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptForge AI — Shopify for AI Micro-Products</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('studio');
      const [paystackUrl, setPaystackUrl] = useState('');
      const [toolTitle, setToolTitle] = useState('Real Estate Property Listing Crafter');
      const [promptTemplate, setPromptTemplate] = useState(
        "Generate a high-converting property description for a {{bedrooms}} bedroom house in {{location}} featuring {{key_amenity}} with a {{tone}} tone."
      );
      const [variables, setVariables] = useState({});
      const [executing, setExecuting] = useState(false);
      const [executionOutput, setExecutionOutput] = useState('');
      const [price, setPrice] = useState(299);

      // Automatically parse {{variable}} tags
      useEffect(() => {
        const regex = /\{\{([^}]+)\}\}/g;
        const matches = [...promptTemplate.matchAll(regex)];
        const extractedVars = {};
        matches.forEach(match => {
          const varName = match[1].trim();
          if (varName) {
            extractedVars[varName] = variables[varName] || '';
          }
        });
        setVariables(extractedVars);
      }, [promptTemplate]);

      const handleVariableChange = (key, value) => {
        setVariables(prev => ({ ...prev, [key]: value }));
      };

      const executePrompt = () => {
        setExecuting(true);
        setExecutionOutput('');
        
        setTimeout(() => {
          setExecuting(false);
          setExecutionOutput(
            `✨ [AI MICRO-APP OUTPUT GENERATED]\n\n"Stunning ${variables.bedrooms || '3'} Bedroom Home in ${variables.location || 'Cape Town'}!\n\nWelcome to modern luxury living. Featuring a world-class ${variables.key_amenity || 'private pool'}, this property offers the perfect blend of comfort and elegance. Contact our agent today for an exclusive viewing."`
          );
        }, 1200);
      };

      const handlePaymentClick = () => {
        if (paystackUrl) {
          window.open(paystackUrl, '_blank');
        } else {
          alert("Creator Notice: Paste your Paystack or Lemon Squeezy checkout link in the settings box to activate live customer payments!");
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header */}
          <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/20">
                  PF
                </div>
                <div>
                  <h1 class="font-bold text-lg leading-none bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PromptForge AI</h1>
                  <span class="text-xs text-indigo-400 font-medium">Shopify for AI Micro-Products</span>
                </div>
              </div>

              <div class="flex items-center space-x-2">
                <button 
                  onClick={() => setActiveTab('studio')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'studio' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  🛠️ Builder Studio
                </button>
                <button 
                  onClick={() => setActiveTab('preview')}
                  class={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${activeTab === 'preview' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                >
                  👁️ Live Customer Storefront
                </button>
              </div>
            </div>
          </header>

          {/* Banner */}
          <div class="bg-indigo-950/40 border-b border-indigo-500/20 py-2.5 px-4 text-center">
            <p class="text-xs text-indigo-300 font-medium">
              🚀 <span class="font-bold text-white">Build AI tools. Embed them anywhere. Get paid.</span> Keep 100% of your revenue using direct Paystack or Lemon Squeezy payouts.
            </p>
          </div>

          {/* Main Body */}
          <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Creator Builder Studio */}
            <div class="lg:col-span-7 space-y-6">
              
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-indigo-400 tracking-wider uppercase mb-4">1. Configure Your AI Micro-Tool</h2>
                
                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Micro-App Title</label>
                    <input 
                      type="text" 
                      value={toolTitle}
                      onChange={(e) => setToolTitle(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <div class="flex justify-between items-center mb-1">
                      <label class="block text-xs font-medium text-slate-400">Backend System Prompt (Hidden from Customers)</label>
                      <span class="text-[10px] text-emerald-400 font-semibold">🔒 Protected IP</span>
                    </div>
                    <textarea 
                      value={promptTemplate}
                      onChange={(e) => setPromptTemplate(e.target.value)}
                      rows="4"
                      class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 font-mono focus:border-indigo-500 focus:outline-none"
                    ></textarea>
                  </div>

                  {/* Payment Gateway URL Config */}
                  <div class="pt-3 border-t border-slate-800">
                    <label class="block text-xs font-bold text-slate-300 mb-1">Your Direct Payment Link (Paystack or Lemon Squeezy)</label>
                    <input 
                      type="url" 
                      value={paystackUrl}
                      onChange={(e) => setPaystackUrl(e.target.value)}
                      placeholder="https://paystack.com/pay/your-page-link"
                      class="w-full bg-slate-950 border border-indigo-500/40 rounded-xl px-3 py-2 text-xs text-emerald-400 font-mono focus:border-indigo-500 focus:outline-none"
                    />
                    <p class="text-[10px] text-slate-500 mt-1">Customers clicking "Unlock App" will pay you directly through this URL.</p>
                  </div>
                </div>
              </div>

              {/* Execution Test Drive */}
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-indigo-400 tracking-wider uppercase mb-3">2. Test Run & Form Preview</h2>
                
                <div class="space-y-3 mb-4">
                  {Object.keys(variables).map(key => (
                    <div key={key}>
                      <label class="block text-xs font-medium text-slate-400 capitalize mb-1">{key}</label>
                      <input 
                        type="text" 
                        value={variables[key]} 
                        onChange={(e) => handleVariableChange(key, e.target.value)}
                        placeholder={`e.g. ${key}`}
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:border-indigo-500 focus:outline-none"
                      />
                    </div>
                  ))}
                </div>

                <button 
                  onClick={executePrompt}
                  disabled={executing}
                  class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg transition disabled:opacity-50"
                >
                  {executing ? '⚡ Generating Output...' : '🚀 Test AI Execution'}
                </button>

                {executionOutput && (
                  <div class="mt-4 p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-emerald-400 font-mono whitespace-pre-wrap">
                    {executionOutput}
                  </div>
                )}
              </div>

            </div>

            {/* Right Column: Customer Storefront & Embed Code */}
            <div class="lg:col-span-5 space-y-6">
              
              {/* Paywall Storefront Live Card */}
              <div class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-5 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-indigo-600 text-white text-[9px] font-bold px-3 py-1 rounded-bl-xl uppercase tracking-wider">
                  Customer View
                </div>

                <h3 class="text-base font-bold text-white mb-1">{toolTitle}</h3>
                <p class="text-xs text-slate-400 mb-4">Powered by PromptForge AI Workflows</p>

                {/* Price tag */}
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-center mb-4">
                  <span class="text-2xl font-black text-white">R{price}</span>
                  <span class="text-xs text-slate-400"> / unlimited access</span>
                </div>

                <button 
                  onClick={handlePaymentClick}
                  class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-xs shadow-lg shadow-emerald-500/20 transition transform active:scale-95"
                >
                  💳 Unlock App Access Now
                </button>
              </div>

              {/* Embed Code Snippet */}
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h3 class="text-xs font-bold text-indigo-400 tracking-wider uppercase mb-2">3. Embed Micro-App On Your Site</h3>
                <p class="text-xs text-slate-400 mb-3">Copy and paste this snippet into WordPress, Webflow, Shopify, or any website:</p>
                
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 font-mono text-[11px] text-slate-300 break-all select-all">
                  &lt;iframe src="https://cingacman-tech-promptforge-app.vercel.app" width="100%" height="600" frameborder="0"&gt;&lt;/iframe&gt;
                </div>

                <button 
                  onClick={() => alert("Embed Code Copied to Clipboard!")}
                  class="w-full mt-3 py-2 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs transition"
                >
                  📋 Copy Embed Code
                </button>
              </div>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
